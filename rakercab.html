<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rundown Rakercab DPC PKS Ujungberung</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#fd5002',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons (Versi UMD yang stabil untuk browser) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <!-- Font Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        /* Smooth transition for max-height */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 300px; /* Cukup besar untuk konten */
            opacity: 1;
        }
        .chevron {
            transition: transform 0.3s ease;
        }
        .chevron.rotate {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 py-6 px-4 flex justify-center items-start">

    <!-- Container Utama -->
    <div class="w-full max-w-lg bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-200">
        
        <!-- Header Visual -->
        <img src="https://blogger.googleusercontent.com/img/a/AVvXsEiiiG7rVZkEv0NVmk6APwbXNOwLGozvBcQX8yH_U-x6qg7MXihUObEfs-LNk7nOGr-TL2OrTqwDH_W985UXOC1TA3fSM5xfUc-NKqTyWxk6sp5jVqRKDu3hMllYolSP1baCd67LsdqnXy2fzV0_jEX2tEp_veTEQf3avciBB4Uxk22dYBveQ8iSVqULpuo" alt="Header Rakercab" class="w-full h-auto">

        <!-- Content Container -->
        <div id="rundown-container" class="p-4 space-y-3 bg-slate-50 min-h-[500px]">
            <!-- Item rundown akan di-generate oleh JavaScript di sini -->
        </div>

        <!-- Footer -->
        <div class="bg-white p-4 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold italic">
                "Berkhidmat untuk Rakyat"
            </p>
        </div>

    </div>

    <script>
        // Data Rundown
        const rundownData = [
            { id: 1, time: "08:00 - 08:30", title: "Registrasi Peserta", pengisi: "Panitia", detail: "Pendataan ulang peserta rakercab. Peserta mengisi daftar hadiri acara.", perlengkapan: "Form Registrasi", type: "general" },
            { id: 2, time: "08:30 - 08:45", title: "Pembukaan Acara", pengisi: "MC: Sigit Kurniawan", detail: "Pembukaan resmi dengan pembacaan Surat Al-Fatihah dan Sholawat.", perlengkapan: "-", type: "main" },
            { id: 3, time: "08:45 - 08:50", title: "Menyanyikan Indonesia Raya", pengisi: "Operator", detail: "Seluruh hadirin dimohon berdiri.", perlengkapan: "File Video", type: "main" },
            { id: 4, time: "08:50 - 08:55", title: "Menyanyikan Mars PKS", pengisi: "Operator", detail: "Seluruh hadirin dimohon mengikuti instruksi dirigen.", perlengkapan: "File Video", type: "main" },
            { id: 5, time: "08:55 - 09:00", title: "Tilawah", pengisi: "Ustad Deni Birrulwalidain", detail: "Pembacaan ayat suci Al-Qur'an.", perlengkapan: "-", type: "special" },
            { id: 6, time: "09:00 - 09:05", title: "Doa", pengisi: "Ustad Deni Birrulwalidain", detail: "Memohon keberkahan dan kelancaran acara.", perlengkapan: "-", type: "special" },
            { id: 7, time: "09:05 - 09:10", title: "Laporan Ketua Panitia", pengisi: "Yogi Gustaman", detail: "Penyampaian tujuan dan teknis pelaksanaan rakercab.", perlengkapan: "-", type: "person" },
            { id: 8, time: "09:10 - 09:20", title: "Sambutan Ketua DPC", pengisi: "Agus Suwandi", detail: "Arahan umum untuk pengurus dan kader Ujungberung.", perlengkapan: "-", type: "highlight" },
            { id: 9, time: "09:20 - 09:35", title: "Sambutan Utusan DPD", pengisi: "Dalam konfirmasi", detail: "Arahan strategis dari pimpinan daerah.", perlengkapan: "-", type: "highlight" },
            { id: 10, time: "09:35 - 09:50", title: "Video Arahan Presiden PKS", pengisi: "Operator", detail: "Menyimak pesan dan arahan pusat.", perlengkapan: "File Video", type: "main" },
            { id: 11, time: "09:50 - 10:20", title: "Pemaparan Rencana Proker DPC", pengisi: "Agus Suwandi", detail: "Presentasi draf program kerja tahun 2026.", perlengkapan: "-", type: "highlight" },
            { id: 12, time: "10:20 - 11:05", title: "Rapat / Diskusi", pengisi: "Semua Peserta", detail: "Sesi diskusi mendalam per bidang atau komisi.", perlengkapan: "-", type: "main" },
            { id: 13, time: "11:05 - 11:20", title: "Pleno Pengesahan RK 2026", pengisi: "Agus Suwandi", detail: "Pengesahan final rencana kerja yang telah disepakati.", perlengkapan: "-", type: "highlight" },
            { id: 14, time: "11:20 - 11:25", title: "Hymne PKS", pengisi: "Operator", detail: "Penutupan sesi resmi.", perlengkapan: "File Video", type: "main" },
            { id: 15, time: "11:25 - 11:30", title: "Penutupan", pengisi: "MC: Sigit Kurniawan", detail: "Acara selesai dan ramah tamah.", perlengkapan: "-", type: "general" },
        ];

        // State untuk melacak item yang terbuka (default index 0)
        let openId = 1;

        // Helper: Warna Border
        function getBorderColor(type) {
            switch (type) {
                case 'highlight': return 'border-l-4 border-yellow-500';
                case 'general': return 'border-l-4 border-slate-300';
                case 'person': return 'border-l-4 border-blue-500';
                case 'special': return 'border-l-4 border-green-500';
                default: return 'border-l-4 border-primary';
            }
        }

        // Helper: Warna Badge Waktu
        function getTimeBadgeColor(type) {
            switch (type) {
                case 'highlight': return 'bg-yellow-100 text-yellow-700';
                case 'general': return 'bg-slate-100 text-slate-600';
                case 'person': return 'bg-blue-100 text-blue-700';
                case 'special': return 'bg-green-100 text-green-700';
                default: return 'bg-primary/10 text-primary';
            }
        }

        // Helper: Hitung Durasi dari string waktu "HH:MM - HH:MM"
        function calculateDuration(timeString) {
            const parts = timeString.split(' - ');
            if (parts.length !== 2) return null;

            const [startTimeStr, endTimeStr] = parts;
            const start = new Date(`1970-01-01T${startTimeStr}:00`);
            const end = new Date(`1970-01-01T${endTimeStr}:00`);

            const diffMs = end - start;
            return diffMs / (1000 * 60); // return difference in minutes
        }

        // Render List
        function renderRundown() {
            const container = document.getElementById('rundown-container');
            if (!container) return;
            
            container.innerHTML = ''; // Clear previous content

            rundownData.forEach((item) => {
                const isOpen = openId === item.id;
                const duration = calculateDuration(item.time);
                
                // Styles Dynamic
                const borderColor = getBorderColor(item.type);
                const badgeColor = getTimeBadgeColor(item.type);
                const titleColor = isOpen ? 'text-primary' : 'text-slate-800';
                const wrapperShadow = isOpen ? 'ring-2 ring-primary/20 shadow-lg border-primary/20' : 'border-slate-100 shadow-sm';
                const chevronRotate = isOpen ? 'rotate text-primary' : '';
                const contentClass = isOpen ? 'open' : '';

                // HTML String
                const html = `
                <div class="bg-white rounded-2xl border transition-all duration-300 ${wrapperShadow}">
                    <!-- Trigger -->
                    <div onclick="toggleAccordion(${item.id})" class="p-4 cursor-pointer flex items-center justify-between ${borderColor}">
                        <div class="flex flex-col gap-1.5">
                            <div class="flex items-center gap-2">
                                <span class="w-fit px-2 py-0.5 rounded text-[10px] font-bold ${badgeColor}">
                                    ${item.time}
                                </span>
                                ${duration ? `
                                <span class="text-slate-400 text-[10px] font-semibold flex items-center gap-1">
                                    <i data-lucide="clock" width="10" height="10"></i>
                                    ${duration} min
                                </span>` : ''}
                            </div>
                            <h3 class="font-bold text-sm sm:text-base ${titleColor}">
                                ${item.title}
                            </h3>
                        </div>
                        <i data-lucide="chevron-down" class="text-slate-400 chevron ${chevronRotate}" width="18" height="18"></i>
                    </div>

                    <!-- Body -->
                    <div class="accordion-content ${contentClass}">
                        <div class="px-4 pb-4 pt-2 space-y-3">
                            <div class="h-px bg-slate-100"></div>
                            
                            <div class="flex gap-3 items-start text-sm">
                                <i data-lucide="info" class="text-slate-400 shrink-0 mt-0.5" width="16" height="16"></i>
                                <p class="text-slate-600 leading-relaxed italic">${item.detail}</p>
                            </div>

                            <div class="flex gap-3 items-center text-sm">
                                <i data-lucide="user" class="text-slate-400 shrink-0" width="16" height="16"></i>
                                <span class="font-semibold text-primary bg-primary/10 px-2 py-0.5 rounded uppercase text-[11px]">
                                    ${item.pengisi}
                                </span>
                            </div>

                            ${item.perlengkapan !== "-" ? `
                            <div class="flex gap-3 items-center text-sm">
                                <i data-lucide="check-circle" class="text-emerald-500 shrink-0" width="16" height="16"></i>
                                <span class="text-slate-500 text-xs">Perlengkapan: ${item.perlengkapan}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
                `;
                
                // Append string as real DOM nodes
                container.insertAdjacentHTML('beforeend', html);
            });

            // Re-initialize icons for new elements
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // Logic Toggle
        function toggleAccordion(id) {
            // Jika klik yang sudah terbuka, tutup (set null). Jika belum, buka (set id).
            openId = (openId === id) ? null : id;
            renderRundown();
        }

        // Initial Render when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            renderRundown();
        });
        
        // Backup: Run immediately just in case
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
             setTimeout(renderRundown, 100);
        }

    </script>
</body>
</html>
